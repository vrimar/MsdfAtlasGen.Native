name: build-native

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'external/**'
      - 'native/**'
      - 'build/**'
      - '.github/workflows/build-native.yml'
  push:
    branches: [main]
    paths:
      - 'external/**'
      - 'native/**'
      - 'build/**'
      - '.github/workflows/build-native.yml'

permissions:
  contents: read

concurrency:
  group: build-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-2022
            script: pwsh build/build-native-win.ps1
          - rid: linux-x64
            runner: ubuntu-22.04
            script: bash build/build-native-unix.sh linux-x64
          # osx-x64 is cross-compiled to x86_64 on an arm64 runner: GitHub's Intel
          # (macos-13) runners are deprecated and queue for a very long time.
          - rid: osx-x64
            runner: macos-14
            script: bash build/build-native-unix.sh osx-x64
          - rid: osx-arm64
            runner: macos-14
            script: bash build/build-native-unix.sh osx-arm64

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up CMake + Ninja
        uses: lukka/get-cmake@latest

      - name: Set up MSVC (Windows)
        if: matrix.rid == 'win-x64'
        uses: microsoft/setup-msbuild@v3

      - name: Install Linux build deps
        if: matrix.rid == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config nasm autoconf automake libtool

      - name: Install macOS build deps
        if: startsWith(matrix.rid, 'osx-')
        run: brew install pkg-config nasm automake autoconf libtool

      - name: Restore vcpkg binary cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.vcpkg-binary-cache
          key: vcpkg-${{ matrix.rid }}-${{ hashFiles('native/vcpkg.json', 'build/triplets/**') }}
          restore-keys: |
            vcpkg-${{ matrix.rid }}-

      - name: Prepare vcpkg binary cache dir
        shell: bash
        run: mkdir -p '${{ github.workspace }}/.vcpkg-binary-cache'

      - name: Build native binaries (${{ matrix.rid }})
        shell: bash
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite
        run: ${{ matrix.script }}

      # Only RIDs that run natively on their runner are execution-tested; osx-x64 is
      # cross-compiled on arm64 and cannot run here.
      - name: Set up .NET
        if: matrix.rid != 'osx-x64'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
          global-json-file: global.json

      # MSDF_REQUIRE_NATIVE makes the tests fail, instead of skipping, when a binary is missing.
      - name: Test both packages against the built binaries
        if: matrix.rid != 'osx-x64'
        shell: bash
        env:
          MSDF_REQUIRE_NATIVE: '1'
        run: |
          set -euo pipefail
          dotnet test tests/MsdfAtlasGen.Native.Tests/MsdfAtlasGen.Native.Tests.csproj -c Release
          dotnet test tests/MsdfAtlasGen.Tests/MsdfAtlasGen.Tests.csproj -c Release

      - name: Upload native binaries
        uses: actions/upload-artifact@v7
        with:
          name: msdf-native-${{ matrix.rid }}
          path: artifacts/native/${{ matrix.rid }}/
          if-no-files-found: error
          retention-days: 14
