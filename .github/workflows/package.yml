name: package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g., 1.0.0)'
        required: true
        type: string
      publish:
        description: 'Push to NuGet.org'
        required: true
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-native:
    uses: ./.github/workflows/build-native.yml

  pack:
    name: dotnet pack
    needs: build-native
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
          global-json-file: global.json

      - name: Download all native artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: msdf-native-*
          path: artifacts/native/
          merge-multiple: false

      - name: Reshape artifact layout
        run: |
          set -euo pipefail
          for src in artifacts/native/msdf-native-*; do
              rid="${src#artifacts/native/msdf-native-}"
              mv "$src" "artifacts/native/$rid"
          done
          find artifacts -type f

      - name: Determine package version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-ci.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and pack
        run: |
          dotnet build MsdfAtlasGen.Native.slnx -c Release -p:Version=${{ steps.version.outputs.value }}
          dotnet pack  src/MsdfAtlasGen.Native/MsdfAtlasGen.Native.csproj -c Release -p:Version=${{ steps.version.outputs.value }} -o packages
          dotnet pack  src/MsdfAtlasGen/MsdfAtlasGen.csproj -c Release -p:Version=${{ steps.version.outputs.value }} -o packages

      - name: Verify every RID is packed
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          require() {
              unzip -Z1 "packages/$1.$VERSION.nupkg" | grep -qx "$2" || { echo "::error::$1 is missing $2"; exit 1; }
          }
          for rid in win-x64 linux-x64 osx-x64 osx-arm64; do
              case "$rid" in
                  win-*) lib=msdf_atlas_c.dll;      exe=msdf-atlas-gen.exe ;;
                  osx-*) lib=libmsdf_atlas_c.dylib; exe=msdf-atlas-gen ;;
                  *)     lib=libmsdf_atlas_c.so;    exe=msdf-atlas-gen ;;
              esac
              require MsdfAtlasGen "runtimes/$rid/native/$lib"
              require MsdfAtlasGen.Native "tools/$rid/$exe"
          done

      - name: Upload nupkgs
        uses: actions/upload-artifact@v7
        with:
          name: nupkgs
          path: packages/

  smoke:
    name: consume packages (${{ matrix.rid }})
    needs: pack
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # No runner executes osx-x64 natively.
        include:
          - rid: win-x64
            runner: windows-2022
          - rid: linux-x64
            runner: ubuntu-22.04
          - rid: osx-arm64
            runner: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
          global-json-file: global.json

      - name: Download nupkgs
        uses: actions/download-artifact@v8
        with:
          name: nupkgs
          path: packages/

      - name: Run, publish and AOT-publish a consuming app
        shell: bash
        env:
          VERSION: ${{ needs.pack.outputs.version }}
          RID: ${{ matrix.rid }}
        run: bash tests/PackageSmoke/run.sh packages "$VERSION" "$RID"

  publish:
    name: dotnet nuget push
    needs: [pack, smoke]
    if: ${{ (inputs.publish == true) || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-22.04
    permissions:
      id-token: write

    steps:
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Download nupkgs
        uses: actions/download-artifact@v8
        with:
          name: nupkgs
          path: packages/

      - name: Log in to NuGet.org
        id: login
        uses: NuGet/login@v1
        with:
          user: vrimar

      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push 'packages/*.nupkg' --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
