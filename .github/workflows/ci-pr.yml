name: ci-pr

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  managed:
    name: Build managed package (no natives)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
          global-json-file: global.json

      - name: Build solution
        run: dotnet build MsdfAtlasGen.Native.slnx -c Release -p:SkipNativeWarning=true

      - name: Run tests (native binaries absent → the tests that need them self-skip)
        run: |
          set -euo pipefail
          dotnet test tests/MsdfAtlasGen.Native.Tests/MsdfAtlasGen.Native.Tests.csproj -c Release --no-build
          dotnet test tests/MsdfAtlasGen.Tests/MsdfAtlasGen.Tests.csproj -c Release --no-build
